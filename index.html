<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tracker, simulador y predictor en tiempo real de League of Legends Worlds 2026: Play-In, Swiss Stage, Playoffs, H2H y Monte Carlo." />
    <meta name="theme-color" content="#010A13" />
    <script>
      // Set the theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('wp26:theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Worlds 2026 Predictor</title>
    <script type="module" crossorigin src="./assets/index-DiArCFxQ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-De3mVy_b.css">
  </head>
  <body class="bg-hex-950 text-gold-100 font-sans antialiased">
    <header class="site-header">
      <div class="mx-auto max-w-[1600px] px-4 py-3 flex flex-wrap items-center gap-x-6 gap-y-2">
        <a href="#swiss" class="flex items-center gap-3 shrink-0">
          <img src="./logo.svg" alt="" width="44" height="44" class="site-logo" />
          <span class="leading-tight">
            <span class="block font-display text-lg tracking-[0.2em] text-gold-300">WORLDS 2026</span>
            <span class="block text-[10px] uppercase tracking-[0.35em] text-cyan-neon">Predictor · Tracker</span>
          </span>
        </a>
        <nav id="tabs" role="tablist" class="tabs order-3 w-full lg:order-none lg:w-auto"></nav>
        <div class="ml-auto flex items-center gap-3">
          <div id="meta" class="flex items-center gap-3 text-xs text-hex-500"></div>
          <button id="theme-toggle" type="button" class="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema">
            <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
        </div>
      </div>
    </header>
    <main id="view" class="mx-auto max-w-[1600px] px-4 py-6">
      <div class="panel animate-pulse text-center text-hex-500">Cargando datos del torneo…</div>
    </main>
    <footer class="mx-auto max-w-[1600px] px-4 pb-8 text-[11px] text-hex-500">
      Proyecto de fans, sin afiliación con Riot Games. Datos: Leaguepedia / LoL Esports, sincronizados por GitHub Actions. Las probabilidades son estimaciones de un modelo Elo.
    </footer>
  </body>
</html>
