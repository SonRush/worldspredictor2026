name: Sync Worlds data

on:
  schedule:
    # 5 runs a day, 11:00 14:00 17:00 20:00 23:00 Mexico time (CST, UTC-6, no DST):
    # 17:00 20:00 23:00 UTC the same day, 02:00 05:00 UTC the next day.
    # Window: Play-In (Oct 15) -> Final (Nov 14).
    - cron: '0 17,20,23 13-31 10 *'
    - cron: '0 2,5 14-31 10 *'
    - cron: '0 17,20,23 1-15 11 *'
    - cron: '0 2,5 1-16 11 *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Data source'
        type: choice
        options: [all, leaguepedia, lolesports]
        default: all

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Always work on main, whatever the repository's default branch is.
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch & merge upstream data
        env:
          # Optional override; the script falls back to the public lolesports.com key.
          LOLESPORTS_API_KEY: ${{ secrets.LOLESPORTS_API_KEY }}
        run: node scripts/sync_worlds.mjs --source=${{ inputs.source || 'all' }}

      - name: Validate against schema
        run: npm run validate

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- public/data; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore(data): sync Worlds 2026 data [skip ci]"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN (and [skip ci]) don't trigger other
      # workflows, so dispatch the Pages deploy explicitly.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
